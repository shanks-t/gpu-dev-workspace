name: GPU development image

on:
  push:
    branches: [main]
    tags: ["image-v*"]
    paths:
      - ".dockerignore"
      - ".github/workflows/gpu-image.yml"
      - "image/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gpu-dev-workspace

jobs:
  build-test-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read image version
        id: version
        shell: bash
        run: |
          version=$(<image/VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "image/VERSION must contain a semantic version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "image-v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match image-v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build native test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: gpu-dev-workspace:test
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compile CUDA smoke test
        run: docker run --rm --entrypoint gpu-image-smoke-test gpu-dev-workspace:test --compile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image tags
        id: tags
        shell: bash
        run: |
          tags="$IMAGE_NAME:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags="$tags"$'\n'"$IMAGE_NAME:${{ steps.version.outputs.version }}"
          fi
          {
            echo 'value<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish tested image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
