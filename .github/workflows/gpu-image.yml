name: Lecture-full GPU image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gpu-dev-workspace
  IMAGE_DIRECTORY: images/lecture-full

jobs:
  build-test-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # CUDA and PyTorch images need more disk than a stock hosted runner leaves
      # available. These exact paths contain unused SDKs on this disposable VM.
      - name: Reclaim runner disk
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Read image version
        id: version
        shell: bash
        run: |
          version=$(<"$IMAGE_DIRECTORY/VERSION")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$IMAGE_DIRECTORY/VERSION must contain a semantic version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image tags
        id: tags
        shell: bash
        run: |
          tags="$IMAGE_NAME:lecture-full-sha-$GITHUB_SHA"
          tags="$tags"$'\n'"$IMAGE_NAME:lecture-full-v${{ steps.version.outputs.version }}"
          {
            echo 'value<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build, test, and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.IMAGE_DIRECTORY }}
          file: ${{ env.IMAGE_DIRECTORY }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
