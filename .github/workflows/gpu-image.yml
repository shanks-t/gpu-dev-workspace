name: GPU development image

on:
  push:
    branches: [main]
    tags: ["image-v*"]
    paths:
      - ".dockerignore"
      - ".github/workflows/gpu-image.yml"
      - "image/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gpu-dev-workspace

jobs:
  build-test-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # CUDA and PyTorch images need more disk than a stock hosted runner leaves
      # available. These exact paths contain unused SDKs on this disposable VM.
      - name: Reclaim runner disk
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Read image version
        id: version
        shell: bash
        run: |
          version=$(<image/VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "image/VERSION must contain a semantic version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "image-v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match image-v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image tags
        id: tags
        shell: bash
        run: |
          tags="$IMAGE_NAME:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags="$tags"$'\n'"$IMAGE_NAME:${{ steps.version.outputs.version }}"
          fi
          {
            echo 'value<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # BuildKit publishes only after every Dockerfile step, including the native
      # CUDA compile check, has succeeded. Direct push avoids loading a second
      # uncompressed copy of this large image into the runner's Docker daemon.
      - name: Build, test, and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            VERIFY_CUDA_COMPILE=true
          cache-from: type=gha
          provenance: mode=max
