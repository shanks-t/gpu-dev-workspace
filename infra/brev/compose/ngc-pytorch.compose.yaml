x-pytorch: &pytorch
  build:
    context: ..
    dockerfile: Dockerfile
  image: gpu-fundamentals-ngc-pytorch:24.07-py3
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  working_dir: /workspace
  user: ubuntu
  volumes:
    - /home/ubuntu/workspace:/workspace
    - /home/ubuntu/.devcontainer-home:/home/ubuntu
  environment:
    HOME: /home/ubuntu
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  entrypoint: ["bash"]

services:
  pytorch:
    <<: *pytorch

  jupyter:
    <<: *pytorch
    ports:
      - "127.0.0.1:8889:8888"
    command:
      - -lc
      - >-
        exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
        --ServerApp.token='' --ServerApp.password=''
        --NotebookApp.token='' --NotebookApp.password=''
        --ServerApp.allow_remote_access=True
